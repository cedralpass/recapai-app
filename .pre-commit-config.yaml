repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]       # auto-fix what it can
      - id: ruff-format     # ruff's built-in formatter (replaces black)

  - repo: local
    hooks:
      - id: tailwind-build
        name: Rebuild Tailwind CSS
        language: system
        entry: npx tailwindcss -i recap/static/css/input.css -o recap/static/css/output.css --minify
        files: \.(html|css)$
        pass_filenames: false
