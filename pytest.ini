[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    recap: marks tests for the recap application
    aiapi: marks tests for the aiapi application
    eval: marks AI eval tests that call real OpenAI — run with -m eval, requires OPENAI_API_KEY
addopts = -v --strict-markers 