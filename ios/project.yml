name: RecapAI
options:
  bundleIdPrefix: com.gsmalling.recapai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team ID here (or in Xcode → Signing & Capabilities) to run on a device.
    DEVELOPMENT_TEAM: "59L3A2D2X5"
    CODE_SIGN_STYLE: Automatic

targets:
  RecapAI:
    type: application
    platform: iOS
    sources:
      - RecapAI
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gsmalling.recapai
        INFOPLIST_KEY_CFBundleDisplayName: Recap
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: RecapAI/RecapAI.entitlements
    info:
      path: RecapAI/Info.plist
      properties:
        CFBundleDisplayName: Recap
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: RecapAI/RecapAI.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gsmalling.recapai
    dependencies:
      - target: RecapShare

  RecapShare:
    type: app-extension
    platform: iOS
    sources:
      - RecapShare
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gsmalling.recapai.share
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: RecapShare/RecapShare.entitlements
    info:
      path: RecapShare/Info.plist
      properties:
        CFBundleDisplayName: Recap
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: GetPage
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: RecapShare/RecapShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gsmalling.recapai
