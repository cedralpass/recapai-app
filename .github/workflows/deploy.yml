name: Build and Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          AI_API_LogLevel: ${{ vars.AI_API_LOGLEVEL }}
          AI_API_OPENAI: ${{ vars.AI_API_OPENAI }}
          AI_API_SECRET_KEY: ${{ vars.AI_API_SECRET_KEY }}
          AI_OPEN_AI_MODEL: ${{ vars.AI_OPEN_AI_MODEL }}
        run: pytest tests/ -v

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test  # blocks deploy if tests fail
    environment: production  # requires manual approval if you configure protection rules

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: cedralpass
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push recap-aiapi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./devops/Dockerfile.aiapi
          push: true
          platforms: linux/amd64
          tags: ghcr.io/cedralpass/recap-aiapi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push recap-full
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./devops/Dockerfile.full.render
          push: true
          platforms: linux/amd64
          tags: ghcr.io/cedralpass/recap-full:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy — aiapi
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_AIAPI }}"

      - name: Trigger Render deploy — full
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_FULL }}"
