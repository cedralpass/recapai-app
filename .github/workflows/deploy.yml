name: Build and Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          AI_API_LogLevel: ${{ vars.AI_API_LOGLEVEL }}
          AI_API_OPENAI: ${{ vars.AI_API_OPENAI }}
          AI_API_SECRET_KEY: ${{ vars.AI_API_SECRET_KEY }}
          AI_OPEN_AI_MODEL: ${{ vars.AI_OPEN_AI_MODEL }}
        run: pytest tests/ -v

  build-full:
    runs-on: ubuntu-latest
    needs: test
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: cedralpass
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build and push recap-full
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./devops/Dockerfile.full.render
          push: true
          platforms: linux/amd64
          tags: ghcr.io/cedralpass/recap-full:latest
          cache-from: type=gha,scope=recap-full
          cache-to: type=gha,mode=max,scope=recap-full

  build-aiapi:
    runs-on: ubuntu-latest
    needs: test
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: cedralpass
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build and push recap-aiapi
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./devops/Dockerfile.aiapi
          push: true
          platforms: linux/amd64
          tags: ghcr.io/cedralpass/recap-aiapi:latest
          cache-from: type=gha,scope=recap-aiapi
          cache-to: type=gha,mode=max,scope=recap-aiapi

  deploy:
    runs-on: ubuntu-latest
    needs: [build-full, build-aiapi]
    environment: production

    steps:
      - name: Trigger Render deploy — full
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_FULL }}"

      - name: Trigger Render deploy — aiapi
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_AIAPI }}"
